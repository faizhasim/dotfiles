# Hand-maintained baseline. Copied to ~/.omp/agent/config.yml on first
# activation; never overwritten after that (see home-manager/oh-my-pi.nix).
# modelRoles is NOT here — home.activation.ompConfigBootstrap (see
# home-manager/oh-my-pi.nix) patches it into the live file in place on every
# rebuild via yq, always reflecting the current aiHarnessModelProfile.

# ── appearance ──────────────────────────────────────────────
theme:
  dark: dark-nord-enhanced
  light: light-tokyo-night
symbolPreset: nerd
colorBlindMode: false
statusLine:
  preset: nerd
  separator: powerline-thin
  sessionAccent: true
  showHookStatus: true
display:
  shimmer: kitt
  showTokenUsage: true
  tabWidth: 3
  smoothStreaming: false
showHardwareCursor: true
clearOnShrink: false

# ── interaction ─────────────────────────────────────────────
autoResume: true
steeringMode: one-at-a-time
followUpMode: one-at-a-time
interruptMode: immediate
doubleEscapeAction: tree
loop:
  mode: prompt
treeFilterMode: default
# NOTE: run `omp setup stt` after rebuild to download Whisper model files
stt:
  enabled: true
  modelName: base.en
collapseChangelog: true

# ── startup ─────────────────────────────────────────────────
startup:
  setupWizard: false
setupVersion: 1

# ── model ───────────────────────────────────────────────────
defaultThinkingLevel: high
hideThinkingBlock: false
repeatToolDescriptions: false

# ── editing ─────────────────────────────────────────────────
edit:
  mode: hashline
  fuzzyMatch: true
  fuzzyThreshold: 0.95
  hashlineAutoDropPureInsertDuplicates: false
  blockAutoGenerated: true
readLineNumbers: false
readHashLines: true
read:
  defaultLimit: 300

# ── bash interceptor ─────────────────────────────────────
bashInterceptor:
  enabled: true

# ── lsp ─────────────────────────────────────────────────────
lsp:
  enabled: true
  formatOnWrite: false
  diagnosticsOnWrite: true
  diagnosticsOnEdit: false

# ── tools ───────────────────────────────────────────────────
tools:
  discoveryMode: mcp-only
  intentTracing: true
find:
  enabled: true
search:
  enabled: true
calc:
  enabled: true
astGrep:
  enabled: true
astEdit:
  enabled: true
irc:
  enabled: true
debug:
  enabled: true
fetch:
  enabled: true
recipe:
  enabled: true
renderMermaid:
  enabled: true
inspect_image:
  enabled: true
github:
  enabled: true
web_search:
  enabled: true
browser:
  enabled: true
checkpoint:
  enabled: true
vault:
  enabled: true
async:
  enabled: true
  pollWaitDuration: 30s

# ── mcp ─────────────────────────────────────────────────────
mcp:
  enableProjectConfig: true
  discoveryMode: true
  notifications: true

# ── memory ──────────────────────────────────────────────────
memory:
  backend: hindsight
hindsight:
  enabled: true
  scoping: per-project
  autoRecall: true
  autoRetain: true
  retainMode: full-session
  bankMission: A staff engineer using Oh My Pi (omp) for software development, architecture, design, code review, debugging, devops, document management, and general productivity tasks.
branchSummary:
  enabled: false
secrets:
  enabled: true

# ── session ─────────────────────────────────────────────────
compaction:
  enabled: true
  strategy: context-full
  reserveTokens: 16384
  keepRecentTokens: 20000
  autoContinue: true
retry:
  enabled: true
  maxRetries: 3
  baseDelayMs: 2000

# ── plugins & marketplace ───────────────────────────────────
plugins:
  enabled: true
  autoUpdate: false
marketplace:
  autoUpdate: notify

# ── commands & skills ───────────────────────────────────────
commands:
  enableClaudeProject: false
  enableClaudeUser: false

# ── todo ────────────────────────────────────────────────────
todo:
  enabled: true
  eager: false
  reminders: true

# ── tasks ───────────────────────────────────────────────────
task:
  isolation:
    mode: auto
    merge: patch
    commits: ai
  eager: true
  simple: default

# ── providers ───────────────────────────────────────────────
providers:
  webSearch: auto
  image: auto
exa:
  enabled: true
  enableSearch: true
  enableResearcher: true
  enableWebsets: true
