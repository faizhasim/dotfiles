# tuicr configuration
# See: https://github.com/agavra/tuicr/blob/main/docs/CONFIG.md

# Nord high-contrast theme (matches system-wide stylix Nord palette)
theme = "nord-dark-high-contrast"

# Side-by-side diff layout instead of unified (toggle in-app with :diff)
diff_view = "side-by-side"

# Let the terminal background show through panels
transparent_background = true

mouse = true

# Standard review comment categories
comment_types = [
  { id = "issue",     label = "issue",       definition = "problems to fix",          color = "red" },
  { id = "suggestion",label = "suggestion",  definition = "possible improvements",   color = "yellow" },
  { id = "praise",    label = "praise",      definition = "positive feedback",        color = "green" },
  { id = "question",  label = "question",    definition = "ask for clarification",   color = "blue" },
  { id = "nit",       label = "nitpick",     definition = "small optional tweaks",   color = "#d19a66" },
]

[export]
intro = "Code review comments below:"
